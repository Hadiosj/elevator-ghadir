server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /ascenseur {
        return 301 /ascenseur/;
    }

    location /ascenseur/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /ascenseur/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    location /ascenseur/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /ascenseur/index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
}
